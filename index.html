<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0d0f" />
  <meta name="description" content="DDX Coach — персональный дневник тренировок с анатомией мышц, весом и повторами." />
  <title>DDX Coach — персональный тренер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-kicker">DDX · Personal coach</div>
        <h1>Твой зал</h1>
        <p>План Пн–Пт · вес · повторы · мышцы</p>
      </div>
      <div class="pill" id="today-pill">Сегодня</div>
    </header>

    <section class="view active" data-view="home">
      <div class="day-nav" id="day-nav"></div>
      <div class="hero" id="hero"></div>
      <div id="day-meta"></div>
      <div class="panel">
        <h3>Упражнения дня</h3>
        <div class="ex-list" id="ex-list"></div>
      </div>
    </section>

    <section class="view" data-view="exercise" id="ex-view"></section>
    <section class="view" data-view="progress" id="progress-view"></section>
    <section class="view" data-view="coach" id="coach-view"></section>
  </div>

  <nav class="nav" aria-label="Основная навигация">
    <button data-tab="home" class="active"><strong>▣</strong>Тренировка</button>
    <button data-tab="progress"><strong>↗</strong>Прогресс</button>
    <button data-tab="coach"><strong>●</strong>Тренер</button>
  </nav>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
